[project]
name = "attend-face"
version = "0.1.0"
description = "Stateless face verification microservice for Attend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
